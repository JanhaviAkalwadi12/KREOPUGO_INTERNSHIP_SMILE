<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainer Registration - SMILE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef5fc;
            color: #222;
        }

        /* HEADER */

        .header {
            background: white;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .smile {
            width: 55px;
            height: 55px;
            background: #ffc24b;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            margin-right: 10px;

            box-shadow: 0 5px 0 #d99b1b;
        }

        .logo h1 {
            color: #2058a5;
            font-size: 28px;
        }

        .logo p {
            font-size: 11px;
            color: #333;
        }

        /* BACK BUTTON */

        .back-header {
            background: #2058a5;
            color: white;

            padding: 10px 18px;

            text-decoration: none;
            border-radius: 7px;

            font-size: 15px;
            font-weight: bold;

            box-shadow: 0 4px 0 #123a72;

            transition: 0.3s;
        }

        .back-header:hover {
            background: #16457f;
            transform: translateY(-2px);
        }

        /* REGISTRATION BOX */

        .register-box {
            width: 430px;
            margin: 45px auto;

            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .register-box h2 {
            text-align: center;
            color: #2058a5;
            margin-bottom: 10px;
        }

        .text {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        /* LABEL */

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: bold;
            color: #333;
        }

        /* INPUTS */

        input[type="text"],
        input[type="email"],
        input[type="tel"] {

            width: 100%;
            padding: 12px;

            border: 1px solid #c5d4e3;
            border-radius: 7px;

            margin-bottom: 18px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 2px solid #2058a5;
        }

        /* PASSWORD */

        .password-box {
            position: relative;
            margin-bottom: 5px;
        }

        .password-box input {
            width: 100%;

            padding: 12px 45px 12px 12px;

            border: 1px solid #c5d4e3;
            border-radius: 7px;

            font-size: 15px;
        }

        .password-box input:focus {
            outline: none;
            border: 2px solid #2058a5;
        }

        /* EYE */

        .eye {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            font-size: 20px;

            user-select: none;
        }

        /* PASSWORD INFORMATION */

        .password-info {
            font-size: 12px;
            color: #666;

            margin-bottom: 18px;

            line-height: 1.5;
        }

        /* GENDER */

        .gender {
            display: flex;
            align-items: center;

            gap: 20px;

            margin-bottom: 18px;
        }

        .gender label {
            font-weight: normal;

            margin: 0;

            display: flex;
            align-items: center;

            gap: 5px;

            cursor: pointer;
        }

        .gender input {
            width: auto;
            margin: 0;
        }

        /* ERROR */

        .error {
            color: red;

            font-size: 13px;

            margin-top: 5px;
            margin-bottom: 10px;
        }

        /* BUTTONS */

        .form-buttons {
            display: flex;
            gap: 15px;
        }

        .submit-btn,
        .reset-btn {

            width: 50%;

            padding: 13px;

            border: none;
            border-radius: 7px;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .submit-btn {
            background: #2058a5;
            box-shadow: 0 5px 0 #123a72;
        }

        .reset-btn {
            background: #777;
            box-shadow: 0 5px 0 #555;
        }

        .submit-btn:hover {
            background: #16457f;
        }

        .reset-btn:hover {
            background: #555;
        }

        /* LOGIN LINK */

        .login-text {
            text-align: center;

            margin-top: 22px;

            font-size: 14px;
        }

        .login-text a {
            color: #2058a5;

            text-decoration: none;

            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .header {
                padding: 12px 4%;
            }

            .register-box {
                width: 90%;

                margin: 30px auto;

                padding: 25px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .logo p {
                font-size: 10px;
            }

            .smile {
                width: 48px;
                height: 48px;

                font-size: 25px;
            }

            .back-header {
                padding: 9px 13px;
                font-size: 13px;
            }

            .form-buttons {
                gap: 10px;
            }

            .submit-btn,
            .reset-btn {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <div class="logo">

            <div class="smile">
                😊
            </div>

            <div>

                <h1>SMILE</h1>

                <p>Life Skills</p>

                <p>& Emotional Intelligence Program</p>

            </div>

        </div>


        <a href="index.html" class="back-header">
            ← Back
        </a>

    </div>



    <!-- REGISTRATION BOX -->

    <div class="register-box">

        <h2>
            Trainer Registration
        </h2>

        <p class="text">
            Create your account to get started.
        </p>


        <form id="registrationForm">


            <!-- TRAINER NAME -->

            <label for="trainerName">
                Trainer Name
            </label>

            <input type="text" id="trainerName" name="trainerName" placeholder="Enter your name" required>

            <div id="nameError" class="error"></div>



            <!-- TRAINER ID -->

            <label for="trainerId">
                Trainer ID
            </label>

            <input type="text" id="trainerId" name="trainerId" placeholder="Enter your trainer ID" required>



            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input type="email" id="email" name="email" placeholder="Enter your email" required>



            <!-- PHONE -->

            <label for="phone">
                Phone Number
            </label>

            <input type="tel" id="phone" name="phone" placeholder="Enter 10 digit phone number" maxlength="10"
                inputmode="numeric" required>



            <!-- GENDER -->

            <label>
                Gender
            </label>

            <div class="gender">

                <label>

                    <input type="radio" name="gender" value="Male" required>

                    Male

                </label>


                <label>

                    <input type="radio" name="gender" value="Female">

                    Female

                </label>

            </div>



            <!-- USERNAME -->

            <label for="username">
                Username
            </label>

            <input type="text" id="username" name="username" placeholder="Create a username" required>



            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input type="password" id="password" name="password" maxlength="14" placeholder="Create a password"
                    required>

                <span class="eye" onclick="togglePassword()">
                    👁️
                </span>

            </div>


            <p class="password-info">

                Password must contain at least:
                <br>

                • One alphabet
                <br>

                • One number
                <br>

                • One special character
                <br>

                • Exactly 14 characters

            </p>


            <div id="passwordError" class="error"></div>



            <!-- CONFIRM PASSWORD -->

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-box">

                <input type="password" id="confirmPassword" name="confirmPassword" maxlength="14"
                    placeholder="Confirm your password" required>

                <span class="eye" onclick="toggleConfirmPassword()">
                    👁️
                </span>

            </div>


            <div id="confirmError" class="error"></div>



            <!-- BUTTONS -->

            <div class="form-buttons">

                <button type="submit" class="submit-btn">
                    Submit
                </button>


                <button type="reset" class="reset-btn">
                    Reset
                </button>

            </div>


        </form>



        <!-- LOGIN -->

        <p class="login-text">

            Already have an account?

            <a href="loginpage.html">
                Login
            </a>

        </p>

    </div>



    <!-- JAVASCRIPT -->

    <script>


        /* TRAINER NAME */

        document
            .getElementById("trainerName")
            .addEventListener("input", function () {

                this.value = this.value.replace(
                    /[^A-Za-z ]/g,
                    ""
                );

            });



        /* PHONE */

        document
            .getElementById("phone")
            .addEventListener("input", function () {

                this.value = this.value.replace(
                    /[^0-9]/g,
                    ""
                );

            });



        /* SHOW / HIDE PASSWORD */

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }



        /* SHOW / HIDE CONFIRM PASSWORD */

        function toggleConfirmPassword() {

            const password =
                document.getElementById("confirmPassword");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }



        /* FORM VALIDATION */

        document
            .getElementById("registrationForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();


                const trainerName =
                    document
                        .getElementById("trainerName")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value;


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const nameError =
                    document.getElementById("nameError");


                const passwordError =
                    document.getElementById("passwordError");


                const confirmError =
                    document.getElementById("confirmError");


                /* CLEAR ERRORS */

                nameError.textContent = "";

                passwordError.textContent = "";

                confirmError.textContent = "";



                /* NAME VALIDATION */

                if (
                    !/^[A-Za-z]+(?: [A-Za-z]+)*$/
                        .test(trainerName)
                ) {

                    nameError.textContent =
                        "Trainer Name must contain only alphabets and spaces.";

                    return;

                }



                /* PHONE VALIDATION */

                if (
                    !/^[0-9]{10}$/
                        .test(phone)
                ) {

                    alert(
                        "Please enter exactly 10 digits for the phone number."
                    );

                    return;

                }



                /* PASSWORD LENGTH */

                if (
                    password.length !== 14
                ) {

                    passwordError.textContent =
                        "Password must be exactly 14 characters.";

                    return;

                }



                /* PASSWORD REQUIREMENTS */

                const passwordPattern =
                    /^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$/;


                if (
                    !passwordPattern.test(password)
                ) {

                    passwordError.textContent =
                        "Password must contain an alphabet, a number and a special character.";

                    return;

                }



                /* CONFIRM PASSWORD */

                if (
                    password !== confirmPassword
                ) {

                    confirmError.textContent =
                        "Passwords do not match.";

                    return;

                }



                /* SUCCESS */

                alert(
                    "Registration successful!"
                );


                /* GO TO LOGIN PAGE */

                window.location.href =
                    "loginpage.html";

            });



        /* RESET ERRORS */

        document
            .getElementById("registrationForm")
            .addEventListener("reset", function () {

                document
                    .getElementById("nameError")
                    .textContent = "";

                document
                    .getElementById("passwordError")
                    .textContent = "";

                document
                    .getElementById("confirmError")
                    .textContent = "";

            });

    </script>


</body>

</html>
