<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Advisors - SMILE</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
            color: #333;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: white;
            padding: 15px 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }


        /* =========================
           BACK TO HOME BUTTON
        ========================= */

        .back-btn {
            background: #2058a5;
            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 7px;

            font-size: 14px;

            box-shadow: 0 4px 0 #123a72;

            transition: 0.2s;
        }


        .back-btn:hover {
            background: #174a8d;
            transform: translateY(-2px);
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            align-items: center;
        }


        .smile {
            width: 55px;
            height: 55px;

            background: #ffc24b;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            margin-right: 10px;

            box-shadow: 0 5px 0 #d99b1b;
        }


        .logo h1 {
            color: #2058a5;
            font-size: 28px;
        }


        .logo p {
            font-size: 11px;
            color: #333;
        }


        /* =========================
           ADVISORS SECTION
        ========================= */

        .advisors {
            background: #eef5fc;

            padding: 60px 20px;

            min-height: calc(100vh - 85px);
        }


        .advisors-container {
            max-width: 900px;

            margin: auto;
        }


        /* =========================
           MAIN HEADING
        ========================= */

        .advisors h2 {
            text-align: center;

            color: #2058a5;

            font-size: 36px;

            margin-bottom: 40px;
        }


        /* =========================
           ADVISOR CARD
        ========================= */

        .advisor-card {
            background: white;

            padding: 25px 30px;

            margin-bottom: 25px;

            border-radius: 15px;

            border-left: 6px solid #2058a5;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);

            display: flex;

            align-items: center;

            gap: 25px;

            transition: 0.3s;
        }


        .advisor-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.12);
        }


        /* =========================
           SQUARE ADVISOR PHOTO
        ========================= */

        .advisor-card img {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 10px;

            border: 4px solid #2058a5;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.15);

            flex-shrink: 0;
        }


        /* =========================
           ADVISOR INFORMATION
        ========================= */

        .advisor-info {
            flex: 1;
        }


        /* =========================
           ADVISOR NAME
        ========================= */

        .advisor-info h3 {
            color: #385884;

            font-size: 22px;

            margin-bottom: 10px;
        }


        /* =========================
           ADVISOR DESIGNATION
        ========================= */

        .advisor-info p {
            color: #555;

            font-size: 16px;

            line-height: 1.7;

            font-weight: bold;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 12px 4%;
            }


            .back-btn {
                padding: 9px 12px;

                font-size: 13px;
            }


            .smile {
                width: 45px;
                height: 45px;

                font-size: 24px;
            }


            .logo h1 {
                font-size: 24px;
            }


            .logo p {
                font-size: 9px;
            }


            .advisors {
                padding: 40px 20px;
            }


            .advisors h2 {
                font-size: 32px;

                margin-bottom: 30px;
            }


            .advisor-card {
                padding: 22px 20px;

                margin-bottom: 20px;

                flex-direction: column;

                text-align: center;

                gap: 15px;
            }


            /* SQUARE PHOTO ON MOBILE */

            .advisor-card img {
                width: 120px;
                height: 120px;

                border-radius: 10px;
            }


            .advisor-info h3 {
                font-size: 19px;
            }


            .advisor-info p {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <!-- SMILE LOGO -->

        <div class="logo">

            <div class="smile">
                😊
            </div>

            <div>

                    SMILE
                </h1>

                <p>
                    Life Skills
                </p>

                <p>
                    & Emotional Intelligence Program
                </p>

            </div>

        </div>


        <!-- BACK TO HOME -->

        <a href="landingpage1.html" class="back-btn">
            ← Home
        </a>

    </header>



    <!-- =========================

            </h2>


            <!-- =========================

                <img
                    src="shivaprasad.jpeg"

                >

                <div class="advisor-info">

                    <h3>
                        1. DR. S M SHIVAPRASAD
                    </h3>

                    <p>
                        SENIOR SCIENTIST,<br>
                        DIRECTOR OF KARNATAKA STATE HIGHER EDUCATION ACADEMY
                    </p>

                </div>

            </div>




            <!-- =========================
                 ADVISOR 2
            ========================= -->

            <div class="advisor-card">

                <img
                    src="major.jpeg"
                    alt="Major C.S. Anand"
                >

                <div class="advisor-info">

                    <h3>
                        2. MAJOR C.S. ANAND
                    </h3>

                    <p>
                        WELL-KNOWN MOTIVATIONAL SPEAKER
                    </p>

                </div>

            </div>



            <!-- =========================
                 ADVISOR 3
            ========================= -->

            <div class="advisor-card">

                <img
                    src="suresh.jpeg"
                    alt="Suresh Kulkarni"
                >

                <div class="advisor-info">

                    <h3>
                        3. SURESH KULKARNI
                    </h3>

                    <p>
                        WELL-KNOWN EDUCATIONIST
                    </p>

                </div>

            </div>


        </div>

    </section>


</body>

</html>
