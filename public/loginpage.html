<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainer Login - SMILE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef5fc;
        }

        /* ================= HEADER ================= */

        .header {
            background: white;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .smile {
            width: 55px;
            height: 55px;
            background: #ffc24b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-right: 10px;
            box-shadow: 0 5px 0 #d99b1b;
        }

        .logo h1 {
            color: #2058a5;
            font-size: 28px;
        }

        .logo p {
            font-size: 11px;
            color: #333;
        }

        /* ================= BACK BUTTON ================= */

        .back-btn {
            background-color: #2058a5;
            display: flex;
            align-items: center;
            gap: 5px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 8px 16px;
            border: 2px solid #2058a5;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #2058a5;
            color: white;
        }


        /* ================= LOGIN BOX ================= */

        .login-box {
            width: 400px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .login-box h2 {
            text-align: center;
            color: #2058a5;
            margin-bottom: 10px;
        }

        .login-box .text {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        /* ================= FORM ================= */

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #c5d4e3;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        /* ================= PASSWORD ================= */

        .password-box {
            position: relative;
            margin-bottom: 8px;
        }

        .password-box input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 1px solid #c5d4e3;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 2px solid #2058a5;
        }

        /* ================= EYE BUTTON ================= */

        .eye-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
        }

        /* ================= PASSWORD INFO ================= */

        .password-info {
            font-size: 12px;
            color: #777;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* ================= LOGIN LINK ================= */

        .login-btn {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 7px;
            background: #2058a5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 5px 0 #123a72;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #174a8d;
        }

        /* ================= REGISTER ================= */

        .register-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-text a {
            color: #2058a5;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            .login-box {
                width: 90%;
                margin: 50px auto;
                padding: 25px;
            }

        }
    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <div class="header">

        <div class="logo">

            <div class="smile">
                😊
            </div>

            <div>

                <h1>SMILE</h1>

                <p>
                    Life Skills

                </p>
                <p>
                    & Emotional Intelligence Program
                </p>

            </div>

        </div>

        <a href="landingpage1.html" class="back-btn">
            &#8592; Back
        </a>

    </div>



    <!-- ================= LOGIN BOX ================= -->

    <div class="login-box">

        <h2>
            Trainer Login
        </h2>

        <p class="text">
            Login to access your account.
        </p>


        <!-- USERNAME -->

        <label for="username">
            Username
        </label>

        <input type="text" id="username" placeholder="Enter your username">


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>

        <div class="password-box">

            <input type="password" id="password" placeholder="Enter your password" maxlength="14">

            <button type="button" class="eye-btn" onclick="togglePassword()" id="eyeBtn">

                👁️

            </button>

        </div>


        <p class="password-info">

            Password must be exactly 14 characters and contain
            at least one alphabet, one number and one special character.

        </p>


        <!-- ================= LOGIN USING A TAG ================= -->

        <a href="menu.html" class="login-btn" onclick="return validateLogin()">

            Login

        </a>


        <!-- ================= REGISTER ================= -->

        <p class="register-text">

            Don't have an account?

            <a href="registration.html">
                Register
            </a>

        </p>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* SHOW / HIDE PASSWORD */

        function togglePassword() {

            var password =
                document.getElementById("password");

            var eye =
                document.getElementById("eyeBtn");


            if (password.type === "password") {

                password.type = "text";

                eye.innerHTML = "👁️";

            } else {

                password.type = "password";

                eye.innerHTML = "👁️";

            }

        }


        /* LOGIN VALIDATION */

        function validateLogin() {

            var username =
                document.getElementById("username").value.trim();

            var password =
                document.getElementById("password").value;


            /* USERNAME */

            if (username === "") {

                alert("Please enter your username.");

                return false;

            }


            /* EXACTLY 14 CHARACTERS */

            if (password.length !== 14) {

                alert(
                    "Password must be exactly 14 characters."
                );

                return false;

            }


            /* ALPHABET */

            if (!/[A-Za-z]/.test(password)) {

                alert(
                    "Password must contain at least one alphabet."
                );

                return false;

            }


            /* NUMBER */

            if (!/[0-9]/.test(password)) {

                alert(
                    "Password must contain at least one number."
                );

                return false;

            }


            /* SPECIAL CHARACTER */

            if (!/[!@#$%^&*(),.?":{}|<>_\-+=/\\[\];']/.test(password)) {

                alert(
                    "Password must contain at least one special character."
                );

                return false;

            }


            /* ALLOW <a> TAG TO OPEN home.html */

            return true;

        }

    </script>


</body>

</html>
